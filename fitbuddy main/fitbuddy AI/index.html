<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | AI Fitness Plan Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">🏋️ FitBuddy</div>
        <p class="subtitle">AI Fitness Plan Generator</p>

        <form action="/generate-workout" method="post">
            <label>User ID</label>
            <input name="user_id" placeholder="FB001" required>

            <label>Name</label>
            <input name="name" placeholder="Your name" required>

            <label>Age</label>
            <input type="number" name="age" min="10" max="100" required>

            <label>Weight</label>
            <input name="weight" placeholder="65 kg" required>

            <label>Fitness Goal</label>
            <select name="goal" required>
                <option>Weight Loss</option>
                <option>Muscle Gain</option>
                <option>General Fitness</option>
                <option>Strength</option>
                <option>Endurance</option>
            </select>

            <label>Workout Intensity</label>
            <select name="intensity" required>
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>

            <button type="submit">🚀 Generate My Plan</button>
        </form>

        <a class="admin-link" href="/view-all-users">📊 View Admin Dashboard</a>
    </div>
</div>
</body>
</html>
